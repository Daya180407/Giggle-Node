# This workflow verifies that the app installs, typechecks and builds when a release is created.
# The package is private (package.json has "private": true), so it is intentionally not published
# to GitHub Packages.
name: Release check

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
